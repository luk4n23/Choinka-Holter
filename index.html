const cv=document.getElementById('c');
const rnd=new THREE.WebGLRenderer({canvas:cv,antialias:true});
rnd.setPixelRatio(Math.min(devicePixelRatio,2));
rnd.shadowMap.enabled=true;rnd.shadowMap.type=THREE.PCFSoftShadowMap;
const sc=new THREE.Scene();

function plotno(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function grad(stops,w,h,prom){
  const c=plotno(w,h),g=c.getContext('2d');
  const gr=prom?g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2):g.createLinearGradient(0,0,0,h);
  stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,w,h);
  return new THREE.CanvasTexture(c);
}
function brokat(){
  const c=plotno(512,512),g=c.getContext('2d');
  g.fillStyle='#17171a';g.fillRect(0,0,512,512);
  for(let i=0;i<1300;i++){
    const x=Math.random()*512,y=Math.random()*512,r=.5+Math.random()*1.8,a=.25+Math.random()*.75;
    const t=Math.random();
    const col=t<.6?'255,255,255':(t<.87?'205,216,228':'255,232,188');
    g.beginPath();g.arc(x,y,r,0,7);g.fillStyle='rgba('+col+','+a+')';g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(.05,.05);
  return t;
}
function drewno(){
  const c=plotno(1024,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#c9a173');gr.addColorStop(.5,'#c09667');gr.addColorStop(1,'#c59c6c');
  g.fillStyle=gr;g.fillRect(0,0,1024,256);
  for(let i=0;i<190;i++){
    const y=Math.random()*256,h=.5+Math.random()*1.7,a=.03+Math.random()*.11;
    g.strokeStyle='rgba(104,72,40,'+a+')';g.lineWidth=h;
    g.beginPath();g.moveTo(0,y);
    for(let x=0;x<=1024;x+=64)g.lineTo(x,y+Math.sin(x*.012+i)*2.2+Math.random()*1.1);
    g.stroke();
  }
  for(let i=0;i<40;i++){
    const y=Math.random()*256;g.strokeStyle='rgba(238,214,180,.16)';g.lineWidth=.8;
    g.beginPath();g.moveTo(0,y);
    for(let x=0;x<=1024;x+=64)g.lineTo(x,y+Math.sin(x*.009+i)*1.6);g.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3.2,1.4);
  return t;
}
const FLAKE=brokat();
sc.background=grad([[0,'#ded6cb'],[.55,'#cdc3b6'],[1,'#b9ae9f']],256,256,true);

const SH_Z0=-150, SH_Z1=152, SH_X0=-430, SH_X1=580, SH_H=26;
const deska=new THREE.Mesh(new THREE.BoxGeometry(SH_X1-SH_X0,SH_H,SH_Z1-SH_Z0),

deska.position.set((SH_X0+SH_X1)/2,-SH_H/2,(SH_Z0+SH_Z1)/2);

function ksztalt(zew,otw){
  const s=new THREE.Shape(zew.map(p=>new THREE.Vector2(p[0],p[1])));
  if(otw) s.holes=otw.map(h=>new THREE.Path(h.map(p=>new THREE.Vector2(p[0],p[1]))));
  return s;
}
const mCz=new THREE.MeshPhongMaterial({color:0xffffff,map:FLAKE,specularMap:FLAKE,
  specular:0xc2ccd6,shininess:70,side:THREE.DoubleSide});
const mRd=new THREE.MeshPhongMaterial({color:0xE91B23,specular:0x6b2420,shininess:34,
  side:THREE.DoubleSide});
const G={};
function detal(d,mat,nazwa,plaski){
  const gr=new THREE.Group();
  // obrys z otworami + osobne bryly dla wysepek (liczniki liter napisu)
  const bryly=[ksztalt(d.zew,d.otwory)].concat((d.wyspy||[]).map(w=>ksztalt(w,null)));
  for(const sh of bryly){
    const g=new THREE.ExtrudeGeometry(sh,{depth:d.gr,bevelEnabled:false});
    if(plaski){g.rotateX(-Math.PI/2);g.translate(0,0,80);}
    else{g.translate(d.dx,d.dy,d.z-d.gr/2);}
    const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;gr.add(m);
  }
  sc.add(gr);G[nazwa]=gr;
}

detal(D.plyta,mRd,'plyta',false);
detal(D.choinka,mCz,'choinka',false);

const cam=new THREE.PerspectiveCamera(32,1,1,6000);
const CTR=new THREE.Vector3(70,118,44),R=250;
let th=Math.PI/2,ph=1.40,dist=R*2.5,obr=false,roz=false;
function upd(){cam.position.set(CTR.x+dist*Math.sin(ph)*Math.cos(th),
  CTR.y+dist*Math.cos(ph),CTR.z+dist*Math.sin(ph)*Math.sin(th));cam.lookAt(CTR);}
const PF=()=>innerWidth<520?1.62:(innerWidth<760?1.22:1);  // waskie ekrany: odsun kamere
let wid='front';
function W(k){wid=k;const f=PF();
  if(k=='front'){th=Math.PI/2;ph=1.40;dist=R*2.5*f}
  if(k=='iso'){th=1.20;ph=1.26;dist=R*2.45*f}
  if(k=='side'){th=.30;ph=1.40;dist=R*2.4*f}
  if(k=='detal'){th=1.10;ph=1.33;dist=R*1.95*f}
  if(k=='napis'){th=Math.PI/2;ph=.52;dist=R*1.15*f}
  if(!roz)CTR.y=(k=='napis')?6:118;upd();}
function ROZ(){roz=!roz;document.getElementById('br').toggleAttribute('data-on',roz);
  G.plyta.position.set(0,roz?82:0,roz?-78:0);
  G.choinka.position.set(0,roz?176:0,roz?92:0);
  CTR.y=roz?208:118;dist=(roz?R*3.7:R*2.5)*PF();upd();}
function OBR(){obr=!obr;document.getElementById('bo').toggleAttribute('data-on',obr);}
let dn=false,px=0,py=0;
cv.addEventListener('pointerdown',e=>{dn=true;px=e.clientX;py=e.clientY;obr=false;
  document.getElementById('bo').removeAttribute('data-on');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>{dn=false});
cv.addEventListener('pointermove',e=>{if(!dn)return;
  th-=(e.clientX-px)*.0075;ph=Math.max(.35,Math.min(1.56,ph-(e.clientY-py)*.006));
  px=e.clientX;py=e.clientY;upd()});
cv.addEventListener('wheel',e=>{e.preventDefault();
  dist=Math.max(R*.9,Math.min(R*6.5,dist*(1+Math.sign(e.deltaY)*.1)));upd()},{passive:false});
function rs(){rnd.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();if(!roz)W(wid);}
addEventListener('resize',rs);rs();W('front');
(function loop(){requestAnimationFrame(loop);if(obr){th-=.0022;upd();}rnd.render(sc,cam);})();
